name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - "Lambda AWS Functions/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy check-github
        run: |
          cd "Lambda AWS Functions/check-github"
          npm ci --omit=dev
          zip -r function.zip . -x "*.md"
          aws lambda update-function-code \
            --function-name check-github \
            --zip-file fileb://function.zip

      - name: Deploy proxyApi
        run: |
          cd "Lambda AWS Functions/proxyApi"
          npm ci --omit=dev
          zip -r function.zip . -x "*.md"
          aws lambda update-function-code \
            --function-name proxyApi \
            --zip-file fileb://function.zip

  deploy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
